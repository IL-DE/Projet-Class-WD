# Partie 2 - Méthode 2 : Configuration statique des routes dans application-static.properties
eureka.client.enabled=false

spring.cloud.gateway.routes[0].id=CANDIDAT
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/candidates/**,/mic1/addresses/**

spring.cloud.gateway.routes[1].id=JOB
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/jobs/**,/api/categories/**

spring.cloud.gateway.routes[2].id=MEETING
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/meetings/**

spring.cloud.gateway.routes[3].id=NOTIFICATION
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[4].id=CANDITATURE
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/candidature/**
