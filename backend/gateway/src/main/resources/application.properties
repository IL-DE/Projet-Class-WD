spring.application.name=gateway
server.port=8080

# Mode actif par défaut : routage dynamique via Eureka (application-dynamic.properties)
# Autres profils disponibles :
#   --spring.profiles.active=static        (Partie 2 - Méthode 2 : routes statiques dans properties)
#   --spring.profiles.active=static-java   (Partie 2 - Méthode 1 : routes statiques via RouteLocator)
#   --spring.profiles.active=dynamic-java  (Partie 3 - Méthode 1 : routes dynamiques via RouteLocator)
spring.profiles.default=dynamic

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
spring.cloud.loadbalancer.cache.ttl=5s

# Partie 3 - 2.a : Logs de routage et de load balancing
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
